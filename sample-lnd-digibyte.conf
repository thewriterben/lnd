# Sample configuration file for LND with DigiByte support
#
# This file demonstrates how to configure LND to work with the DigiByte
# blockchain. DigiByte features 15-second block times and lower transaction
# fees compared to Bitcoin.
#
# Copy this file to your LND data directory (usually ~/.lnd/) and rename it
# to lnd.conf, then modify the settings to match your setup.

[Application Options]

# The alias your node will use, which can be up to 32 UTF-8 characters in
# length.
alias=My DigiByte Lightning Node

# The color of the node in hex code format
color=#3399FF

# The maximum number of incoming pending channels permitted per peer.
maxpendingchannels=5

# The amount of time to wait before force closing channels
payments-expiration-grace-period=30s

# Logging
debuglevel=info
# logdir=/path/to/logs

# RPC configuration
rpclisten=localhost:10009

# REST configuration  
restlisten=localhost:8080

# Disable listening for P2P connections (useful for private nodes)
# nolisten=true

# External IP address to advertise (if running a public node)
# externalip=your.external.ip.address:9735

[DigiByte]

# Use DigiByte mainnet
digibyte.mainnet=true

# Use DigiByte testnet (comment out mainnet and uncomment this for testing)
# digibyte.testnet=true

# Use DigiByte regtest (for local development only)
# digibyte.regtest=true

# Specify the backend to use (digibyted via bitcoind interface)
digibyte.node=bitcoind

# Minimum HTLC value we will forward (in millisatoshi)
# Lower values allow for smaller payments
digibyte.minhtlc=1

# Minimum HTLC value we will send out (in millisatoshi)
digibyte.minhtlcout=1000

# Base fee charged for forwarding payments (in millisatoshi)
# DigiByte has lower on-chain fees, so we can afford lower routing fees
digibyte.basefee=100

# Fee rate for forwarding payments (in millionths)
# This is the proportional fee: fee = base_fee + (amount * fee_rate / 1000000)
digibyte.feerate=1

# CLTV delta for forwarding
# DigiByte has 15-second blocks, so we use a smaller delta than Bitcoin
# 40 blocks = 10 minutes
digibyte.timelockdelta=40

# Default number of confirmations required for channel funding
# With 15-second blocks, 6 confirmations = 90 seconds
digibyte.defaultchanconfs=6

# Default number of blocks remote peer must wait for unilateral close
digibyte.defaultremotedelay=144

# Minimum and maximum channel sizes (in satoshis)
# Adjust these based on your risk tolerance
minchansize=20000
maxchansize=16777215

[Bitcoind]

# DigiByte Core (digibyted) RPC configuration
# Note: We use the bitcoind interface since DigiByte Core is compatible
# with Bitcoin Core's RPC interface

# RPC server host and port
bitcoind.rpchost=localhost:14022

# RPC username (set in digibyte.conf)
bitcoind.rpcuser=your_rpc_username

# RPC password (set in digibyte.conf)
bitcoind.rpcpass=your_rpc_password

# ZMQ configuration for block and transaction notifications
# These must match your digibyte.conf settings
bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332
bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333

# Fee estimation mode (CONSERVATIVE or ECONOMICAL)
bitcoind.estimatemode=CONSERVATIVE

[autopilot]

# Enable autopilot (automatic channel management)
# autopilot.active=false

# Maximum number of channels to open
# autopilot.maxchannels=5

# Percentage of funds to allocate to channels (0.0 to 1.0)
# autopilot.allocation=0.6

# Minimum channel size for autopilot
# autopilot.minchansize=20000

# Maximum channel size for autopilot
# autopilot.maxchansize=16777215

[tor]

# Use Tor for outbound connections (optional but recommended for privacy)
# tor.active=true
# tor.socks=localhost:9050
# tor.control=localhost:9051

# Stream isolation for Tor connections
# tor.streamisolation=true

[watchtower]

# Enable watchtower client to monitor channels when offline
# wtclient.active=true

[routing]

# Routing policy - set your fee structure here
# routing.minrtprob=0.01

# Number of route attempts
# routing.maxhops=20

################################################################################
# DigiByte Core (digibyted) Configuration Reference
################################################################################
#
# You need a synced DigiByte Core node. Add the following to your digibyte.conf:
#
# # Enable RPC server
# server=1
#
# # RPC credentials (use strong passwords in production!)
# rpcuser=your_rpc_username
# rpcpassword=your_rpc_password
#
# # RPC bind address (localhost for security)
# rpcbind=127.0.0.1
# rpcallowip=127.0.0.1
#
# # Enable ZMQ notifications
# zmqpubrawblock=tcp://127.0.0.1:28332
# zmqpubrawtx=tcp://127.0.0.1:28333
#
# # Transaction index (required for LND)
# txindex=1
#
# # For mainnet, ensure you're on the right network
# # (no additional flags needed for mainnet)
#
# # For testnet:
# # testnet=1
#
# # For regtest (local development):
# # regtest=1
#
################################################################################

################################################################################
# Quick Start Guide
################################################################################
#
# 1. Install and sync DigiByte Core (digibyted)
#    - Download from: https://digibyte.org/
#    - Configure digibyte.conf as shown above
#    - Start digibyted and let it sync (this may take several hours)
#
# 2. Build LND with DigiByte support
#    - Run: ./scripts/build-digibyte.sh
#
# 3. Create LND wallet
#    - Run: ./lnd-digibyte
#    - In another terminal: ./lncli-digibyte create
#    - Follow the prompts to create a new wallet
#
# 4. Fund your wallet
#    - Get your on-chain address: ./lncli-digibyte newaddress p2wkh
#    - Send DigiByte to this address
#
# 5. Open a channel
#    - Connect to a peer: ./lncli-digibyte connect pubkey@host:port
#    - Open channel: ./lncli-digibyte openchannel pubkey amount
#
# 6. Start accepting/sending Lightning payments!
#    - Create invoice: ./lncli-digibyte addinvoice --amt 1000
#    - Pay invoice: ./lncli-digibyte payinvoice <payment_request>
#
################################################################################

################################################################################
# Performance Notes for DigiByte
################################################################################
#
# DigiByte's 15-second block times offer unique advantages:
#
# - Faster channel confirmations (6 blocks = 90 seconds vs Bitcoin's 60 minutes)
# - Quicker force-close resolution
# - Lower on-chain fees (typically 1-10 sats/byte)
# - More frequent routing opportunities due to faster block propagation
#
# Considerations:
#
# - Adjust timelockdelta for the faster block time (40 blocks = 10 minutes)
# - Monitor for chain reorgs (though rare with MultiAlgo mining)
# - Consider slightly higher confirmation requirements for large channels
#
################################################################################
